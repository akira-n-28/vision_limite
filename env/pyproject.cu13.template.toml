# Caso A — driver NVIDIA >= 580: stessa base verificata da Paradigma (torch cu130, vLLM 0.26.0).
# Copiare in env/pyproject.toml; per partire dalle stesse versioni transitive del lock ufficiale,
# copiare anche third_party/limite-violetto/uv.lock in env/uv.lock prima di `setup_env.sh lock`
# (uv tiene le versioni già presenti nel lock quando possibile).
[project]
name = "limite-vl-env"
version = "0.0.0"
requires-python = "~=3.12.0"
dependencies = [
    "torch==2.11.0",
    "transformers==5.6.2",
    "vllm==0.26.0",
    "pillow",
    "numpy",
    "pyarrow",
    "safetensors",
    "webdataset",
    "imagehash",
    "matplotlib",
    "sympy",
    "math-verify",
    "tqdm",
    "hatchling",   # per installare offline il plugin Limite
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
